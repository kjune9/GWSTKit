name: subject_sticker
description: >-
  On-device subject cutout (Android ML Kit Subject Segmentation, iOS Vision
  foreground instance mask) plus sticker-style border rendering — white margin,
  colored contour line, stitch dashes, tinted margin, rounded finishing.
version: 0.1.0
homepage: https://github.com/kjune9/GWSTKit
repository: https://github.com/kjune9/GWSTKit

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  # Pure-Dart image decode/encode for the sticker post-processing.
  image: ^4.2.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.gwsticktogether.subject_sticker
        pluginClass: SubjectStickerPlugin
      ios:
        pluginClass: SubjectStickerPlugin
