name: subject_sticker
description: >-
  On-device subject cutout (ML Kit Subject Segmentation) plus sticker-style
  border rendering — white margin, colored contour line, stitch dashes,
  tinted margin, rounded finishing. Pure Dart post-processing.
version: 0.0.2
homepage: https://github.com/kjune9/GWSTKit
repository: https://github.com/kjune9/GWSTKit

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  # On-device subject segmentation (Android; beta plugin). Requires minSdk 24.
  google_mlkit_subject_segmentation: ^0.0.2
  # Pure-Dart image decode/encode for the sticker post-processing.
  image: ^4.2.0

dev_dependencies:
  flutter_lints: ^5.0.0
