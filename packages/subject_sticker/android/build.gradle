group = "com.gwsticktogether.subject_sticker"
version = "0.1.0"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.13.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.gwsticktogether.subject_sticker"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        // ML Kit Subject Segmentation requires API 24+.
        minSdk = 24
    }

    dependencies {
        // Thin client backed by Play Services; the segmentation model is
        // downloaded by Play Services (see README for the manifest meta-data
        // that makes Play pre-download it at install time).
        implementation("com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1")
    }
}
